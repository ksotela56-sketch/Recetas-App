<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Recetas-App{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a href="{{ url_for('index') }}"><h2 style="margin:0;display:inline">🍳 Recetas-App</h2></a>
    <nav class="main-nav">
      <a href="{{ url_for('recetas.listado') }}">Recetas</a>
      <a href="{{ url_for('categorias.listado') }}">Categorías</a>
      <a href="{{ url_for('buscar.buscar') }}">Buscar</a>
      <a href="{{ url_for('planes.listado') }}">Planificación semanal</a>
      <a href="{{ url_for('listas.listado') }}">Lista de la compra</a>
    </nav>
  </header>
  <main>
    {% with mensajes = get_flashed_messages(with_categories=true) %}
      {% for categoria, mensaje in mensajes %}
        <div class="flash {{ categoria }}">{{ mensaje }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
